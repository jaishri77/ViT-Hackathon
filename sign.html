<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CORTEX | Sign Up</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #05080d;
            --card: #0d1219;
            --border: #242b34;
            --cyan: #00d9ff;
            --green: #00f5a0;
            --text: #f1f5f9;
            --muted: #8b98a8;
        }

        body {

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background: var(--bg);

            color: var(--text);

            font-family: Arial, Helvetica, sans-serif;
        }

        .signup-container {

            width: 400px;

            padding: 35px;

            background: var(--card);

            border: 1px solid var(--border);

            border-radius: 15px;

            box-shadow:
                0 0 30px
                rgba(0,217,255,0.08);
        }

        .logo {

            width: 55px;
            height: 55px;

            margin: 0 auto 15px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #00d9ff,
                    #662cff
                );

            font-size: 28px;

            font-weight: bold;
        }

        h1 {

            text-align: center;

            font-size: 27px;

            letter-spacing: 1px;
        }

        .subtitle {

            text-align: center;

            color: var(--cyan);

            font-size: 12px;

            font-weight: bold;

            margin-top: 5px;

            margin-bottom: 30px;

            text-transform: uppercase;
        }

        .form-group {

            margin-bottom: 18px;
        }

        label {

            display: block;

            margin-bottom: 7px;

            color: var(--muted);

            font-size: 13px;
        }

        .input-box {

            position: relative;
        }

        .input-box i {

            position: absolute;

            left: 14px;

            top: 50%;

            transform: translateY(-50%);

            color: var(--muted);
        }

        input {

            width: 100%;

            padding: 13px 13px 13px 42px;

            background: #080d13;

            color: white;

            border: 1px solid var(--border);

            border-radius: 7px;

            outline: none;

            font-size: 14px;
        }

        input:focus {

            border-color: var(--cyan);
        }

        .signup-button {

            width: 100%;

            padding: 13px;

            margin-top: 8px;

            background: var(--cyan);

            color: #041018;

            border: none;

            border-radius: 7px;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;
        }

        .signup-button:hover {

            opacity: 0.9;
        }

        .login-text {

            text-align: center;

            color: var(--muted);

            font-size: 13px;

            margin-top: 22px;
        }

        .login-text a {

            color: var(--cyan);

            text-decoration: none;

            font-weight: bold;
        }

        .login-text a:hover {

            text-decoration: underline;
        }

    </style>

</head>


<body>


<div class="signup-container">


    <div class="logo">
        C
    </div>


    <h1>CORTEX</h1>


    <div class="subtitle">
        Create Your Intelligence Account
    </div>


    <form onsubmit="signupUser(event)">


        <div class="form-group">

            <label>Full Name</label>

            <div class="input-box">

                <i class="fa-solid fa-user"></i>

                <input
                    type="text"
                    id="signupName"
                    placeholder="Enter your name"
                    required>

            </div>

        </div>


        <div class="form-group">

            <label>Email</label>

            <div class="input-box">

                <i class="fa-solid fa-envelope"></i>

                <input
                    type="email"
                    id="signupEmail"
                    placeholder="Enter your email"
                    required>

            </div>

        </div>


        <div class="form-group">

            <label>Password</label>

            <div class="input-box">

                <i class="fa-solid fa-lock"></i>

                <input
                    type="password"
                    id="signupPassword"
                    placeholder="Create a password"
                    required>

            </div>

        </div>


        <div class="form-group">

            <label>Confirm Password</label>

            <div class="input-box">

                <i class="fa-solid fa-lock"></i>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    required>

            </div>

        </div>


        <button
            type="submit"
            class="signup-button">

            CREATE ACCOUNT

        </button>


    </form>


    <div class="login-text">

        Already have an account?

        <a href="login.html">
            Login
        </a>

    </div>


</div>


<script>

    function signupUser(event) {

        event.preventDefault();


        const name =
            document.getElementById("signupName").value;

        const email =
            document.getElementById("signupEmail").value;

        const password =
            document.getElementById("signupPassword").value;

        const confirmPassword =
            document.getElementById("confirmPassword").value;


        if (password !== confirmPassword) {

            alert("Passwords do not match.");

            return;
        }


        localStorage.setItem(
            "cortexName",
            name
        );

        localStorage.setItem(
            "cortexEmail",
            email
        );

        localStorage.setItem(
            "cortexPassword",
            password
        );


        localStorage.setItem(
            "cortexLoggedIn",
            "true"
        );


        window.location.href = "dashboard.html";

    }

</script>


</body>

</html>
